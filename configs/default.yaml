# ──────────────────────────────────────────────────────────────
# RL-Guided Flow Diffusion SBDD — SOTA Configuration v2
# ──────────────────────────────────────────────────────────────

# ── Paths ──
data:
  dataset_json: "final_dataset.json"
  base_dir: "/home/jovyan/dd_pipeline/datasets"

# ── Affinity filtering ──
affinity:
  min: -13.0
  max: -6.0
  reward_offset: 6.0
  reward_scale: 7.0

# ── Train / Val / Test split ──
split:
  train_frac: 0.80
  val_frac: 0.10
  test_frac: 0.10
  seed: 42

# ── RL curriculum ──
curriculum:
  rl_top_percentile: 0.10
  rl_threshold: -11.0

# ── Pocket featurisation ──
pocket:
  cutoff_angstrom: 8.0
  knn_k: 16
  element_dim: 15
  aa_dim: 21
  hidden_dim: 256       # SOTA v2: scaled up from 128

# ── Ligand featurisation ──
ligand:
  atom_types:
    - C
    - N
    - O
    - S
    - F
    - Cl
  num_atom_types: 6
  # Empirical marginal prior (computed from CrossDocked2020 training set).
  # Used as the t=0 noise distribution for discrete flow matching.
  # Run: python scripts/compute_marginal.py  to recompute from scratch.
  marginal_prior: [0.5940, 0.1650, 0.1250, 0.0480, 0.0310, 0.0370]

# ── Pocket Encoder ──
pocket_encoder:
  num_layers: 4
  hidden_dim: 256       # SOTA v2: scaled up from 128

# ── Core SE(3)-EGNN ──
egnn:
  num_layers: 12        # SOTA v2: scaled up from 9
  hidden_dim: 256       # SOTA v2: scaled up from 128
  num_heads: 16
  dropout: 0.0

# ── Flow Matching ──
flow:
  num_steps_train: 1000
  num_steps_sample: 50
  sigma_min: 1.0e-5

# ── Self-Conditioning (FlowMol3 technique) ──
self_conditioning:
  enabled: true
  prob: 0.50            # 50% of training steps use self-conditioning

# ── Affinity value head ──
value_head:
  hidden_dim: 256       # SOTA v2: scaled up from 128
  num_layers: 2

# ── Multi-objective reward ──
reward:
  w_vina: 0.40
  w_qed: 0.20
  w_sa: 0.15
  w_lipinski: 0.10
  w_proxy: 0.10
  min_carbon_ratio: 0.40
  max_nitrogen_ratio: 0.35
  max_nn_bonds: 2
  max_sa_score: 5.0     # SOTA v2: tightened from 6.0
  max_ring_nitrogen: 2
  contrastive_bonus: 0.10
  vina_every_n: 2       # SOTA v2: every 2 steps (was 10)
  min_mol_weight: 200.0 # SOTA v2: reject too-small molecules (< 200 Da)

# ── Phase A: Pretraining ──
pretrain:
  max_steps: 1000000    # SOTA v2: 5x longer (was 200000)
  batch_size: 16        # SOTA v2: reduced from 32 (larger model)
  lr: 2.0e-4            # SOTA v2: slightly lower for larger model
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  grad_clip: 1.0
  affinity_loss_lambda: 0.1
  affinity_temp: 2.0
  type_loss_weight: 1.0 # SOTA v2: CE loss is self-normalizing, weight=1 is correct
  warmup_steps: 10000   # SOTA v2: longer warmup for 1M step schedule
  eval_every: 10000
  save_every: 50000

# ── Phase B: RL Fine-tuning ──
rl:
  max_steps: 5000        # SOTA v2: 5x longer (was 1000)
  lr: 5.0e-6             # SOTA v2: lower lr for refined fine-tuning
  batch_pockets: 2       # SOTA v2: 2 pockets per round
  mols_per_pocket: 8     # SOTA v2: 8 mols per pocket (was 5)
  top_k: 3
  kl_beta_start: 0.005   # SOTA v2: tighter KL for larger model
  kl_beta_end: 0.0005
  kl_anneal: "cosine"
  sample_temperature: 1.2  # exploration temperature for atom type sampling

# ── Hardware ──
hardware:
  device: "cuda"
  num_workers: 0
  pin_memory: true
